name: WineVault
options:
  bundleIdPrefix: com.infinityball
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.42.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    # First-party app/test warnings are errors; do not override GRDB's package settings.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  WineVaultDomain:
    path: Packages/WineVaultDomain
  WineVaultData:
    path: Packages/WineVaultData
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.10.0

targets:
  WineVault:
    type: application
    platform: iOS
    sources:
      - path: WineVault
    dependencies:
      - package: WineVaultDomain
      - package: WineVaultData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.infinityball.winevault
        PRODUCT_NAME: WineVault
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Photograph a wine label when you choose; photos stay in Wine Vault's private storage."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"

  WineVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WineVaultTests
      - path: Packages/WineVaultData/Tests/WineVaultDataTests
    dependencies:
      - target: WineVault
      - package: WineVaultDomain
      - package: WineVaultData
      - package: GRDB
        product: GRDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WineVault.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WineVault"

  WineVaultUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WineVaultUITests
    dependencies:
      - target: WineVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.infinityball.winevault.uitests
        TEST_TARGET_NAME: WineVault

schemes:
  WineVault:
    build:
      targets:
        WineVault: all
        WineVaultTests: [test]
        WineVaultUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - WineVaultTests
        - WineVaultUITests
    archive:
      config: Release
