name: WineVault
options:
  bundleIdPrefix: com.infinityball
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.42.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  WineVaultDomain:
    path: Packages/WineVaultDomain

targets:
  WineVault:
    type: application
    platform: iOS
    sources:
      - path: WineVault
    dependencies:
      - package: WineVaultDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.infinityball.winevault
        PRODUCT_NAME: WineVault
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"

  WineVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WineVaultTests
    dependencies:
      - target: WineVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WineVault.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WineVault"

schemes:
  WineVault:
    build:
      targets:
        WineVault: all
        WineVaultTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - WineVaultTests
    archive:
      config: Release
