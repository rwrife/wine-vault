name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: WineVault
  DESTINATION: "platform=iOS Simulator,name=iPhone 17,OS=latest"

jobs:
  packages:
    name: Domain + data packages (SQLite, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate project.yml
        run: bash Scripts/validate_project_yml.sh

      - name: Check release metadata consistency (plist vs ReleaseInfo)
        run: python3 Scripts/check_release_metadata.py

      - name: Build Swift 6.1 image with SQLite development headers
        run: docker build -f .github/docker/SwiftSQLite.Dockerfile -t wine-vault-swift:6.1-sqlite .

      - name: Test Domain and produce LLVM coverage
        run: |
          mkdir -p coverage
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src" -w /src/Packages/WineVaultDomain \
            wine-vault-swift:6.1-sqlite sh -c '
              set -eu
              swift test --enable-code-coverage \
                -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
              TEST_BINARY=$(find .build -type f \
                -path "*debug/WineVaultDomainPackageTests.xctest" -print -quit)
              llvm-cov export -format=lcov "$TEST_BINARY" \
                -instr-profile=.build/debug/codecov/default.profdata \
                -ignore-filename-regex="(.build|Tests)/" \
                > /src/coverage/domain.lcov
              test -s /src/coverage/domain.lcov
              find Sources -type f -name "*.swift" -print | while IFS= read -r SOURCE; do
                grep -Fq "/Packages/WineVaultDomain/$SOURCE" /src/coverage/domain.lcov || {
                  echo "Missing Domain coverage source entry: $SOURCE"
                  exit 1
                }
              done
            '

      - name: Test Data with real SQLite and produce LLVM coverage
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src" -w /src/Packages/WineVaultData \
            wine-vault-swift:6.1-sqlite sh -c '
              set -eu
              swift test --enable-code-coverage \
                -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
              TEST_BINARY=$(find .build -type f \
                -path "*debug/WineVaultDataPackageTests.xctest" -print -quit)
              llvm-cov export -format=lcov "$TEST_BINARY" \
                -instr-profile=.build/debug/codecov/default.profdata \
                -ignore-filename-regex="(.build|Tests)/" \
                > /src/coverage/data.lcov
              test -s /src/coverage/data.lcov
              find Sources -type f -name "*.swift" -print | while IFS= read -r SOURCE; do
                grep -Fq "/Packages/WineVaultData/$SOURCE" /src/coverage/data.lcov || {
                  echo "Missing Data coverage source entry: $SOURCE"
                  exit 1
                }
              done
            '

      - name: Archive actual package coverage on pull requests
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: swift-package-coverage
          path: |
            coverage/domain.lcov
            coverage/data.lcov
          if-no-files-found: error

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint Domain and Data layers (strict — warnings fail the build)
        run: |
          swiftlint --strict --config .swiftlint.yml \
            Packages/WineVaultDomain/Sources Packages/WineVaultDomain/Tests \
            Packages/WineVaultData/Sources Packages/WineVaultData/Tests
      - name: Lint app sources (non-blocking baseline)
        run: swiftlint --config .swiftlint.yml WineVault WineVaultTests WineVaultUITests

  # iOS 26 SDK build + test gate — macOS runner with Xcode 26.
  build-test:
    name: Build + test (iOS 26 simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26 and verify iOS 26 SDK
        timeout-minutes: 2
        run: |
          XCODE=$(python3 - <<'PY'
          import glob, re
          candidates = glob.glob("/Applications/Xcode_26*.app")
          def version(path):
              return tuple(int(value) for value in re.findall(r"\d+", path))
          print(max(candidates, key=version) if candidates else "")
          PY
          )
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version
          if ! xcodebuild -showsdks | grep -Eqi 'iphoneos(2[6-9]|[3-9][0-9])'; then
            echo "ERROR: iOS 26+ SDK not present on runner — refusing to gate on an older SDK"
            exit 1
          fi

      - name: Generate Xcode project from project.yml
        timeout-minutes: 10
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate

      - name: Build app + local packages (warnings fail the build)
        timeout-minutes: 15
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild build \
            -project WineVault.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -destination-timeout 120 \
            -resultBundlePath artifacts/build.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            2>&1 | tee artifacts/build.log | xcbeautify

      - name: Unit + add-list-search-edit-delete UI tests on iOS 26 simulator
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild test \
            -project WineVault.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -destination-timeout 120 \
            -resultBundlePath artifacts/compact-tests.xcresult \
            -only-testing:WineVaultTests \
            -only-testing:WineVaultUITests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/compact-tests.log | xcbeautify

      - name: Select an available iOS 26+ regular-width iPad simulator
        timeout-minutes: 2
        run: |
          IPAD_UDID=$(python3 - <<'PY'
          import json, re, subprocess
          result = subprocess.run(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              check=True, capture_output=True, text=True, timeout=30
          )
          devices = json.loads(result.stdout)["devices"]
          matches = [
              device["udid"]
              for runtime, runtime_devices in devices.items()
              if (match := re.search(r"iOS-(\d+)", runtime)) and int(match.group(1)) >= 26
              for device in runtime_devices
              if device["name"].startswith("iPad")
          ]
          if not matches:
              raise SystemExit("No available iOS 26+ iPad simulator")
          print(matches[0])
          PY
          )
          echo "REGULAR_DESTINATION=platform=iOS Simulator,id=$IPAD_UDID" >> "$GITHUB_ENV"

      - name: Regular-width split UI test on iOS 26+ iPad
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild test \
            -project WineVault.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$REGULAR_DESTINATION" \
            -destination-timeout 120 \
            -resultBundlePath artifacts/regular-tests.xcresult \
            -only-testing:WineVaultUITests/WineVaultWorkflowUITests/testRegularWidthShowsBrowserAndDetailColumns \
            -only-testing:WineVaultUITests/WineVaultInsightsUITests/testRegularWidthTimelineSelectionKeepsPersistentDetail \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/regular-tests.log | xcbeautify

      - name: Assert simulator app bundle (root-view skeleton)
        timeout-minutes: 2
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData \
            -path "*/Debug-iphonesimulator/WineVault.app" \
            -maxdepth 6 -print -quit)
          test -n "$APP" || { echo "No simulator app bundle found"; exit 1; }
          BID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          [ "$BID" = "com.infinityball.winevault" ] \
            || { echo "Wrong bundle id: $BID"; exit 1; }
          xcrun vtool -show-build "$APP/WineVault" | grep -Eq 'platform[[:space:]]+IOSSIMULATOR' \
            || { echo "Executable is not a simulator-platform binary"; exit 1; }
          test -f "$APP/Info.plist" && test -x "$APP/WineVault"
          echo "Simulator skeleton verified: $APP ($BID)"

      - name: Capture bounded simulator diagnostics
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import subprocess
          try:
              subprocess.run(
                  ["xcrun", "simctl", "diagnose", "--output=artifacts/simulator-diagnostics"],
                  check=False, timeout=120
              )
          except subprocess.TimeoutExpired:
              print("simctl diagnose exceeded 120 seconds; continuing with existing artifacts")
          PY

      - name: Retain native build, test, and simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-26-native-diagnostics
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
